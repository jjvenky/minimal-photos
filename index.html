<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <!-- Include Marked.js to parse Markdown instantly in the browser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; background-color: #111; color: #fff; }
        
        /* Full-screen background slideshow */
        .bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .bg-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s ease-in-out; }
        .bg-slide.active { opacity: 1; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: 0; }

        /* Corner Navigation Menu */
        nav { position: fixed; top: 25px; right: 25px; z-index: 10; display: flex; gap: 12px; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); padding: 8px 12px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.15); }
        nav button { background: transparent; border: none; color: rgba(255, 255, 255, 0.7); font-size: 14px; font-weight: 500; cursor: pointer; padding: 6px 12px; border-radius: 20px; transition: all 0.2s ease; }
        nav button:hover, nav button.active { color: #fff; background: rgba(255, 255, 255, 0.25); }

        /* Content Area */
        .content-wrapper { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; align-items: center; padding: 8vw; }
        .text-box { max-width: 520px; animation: fadeIn 0.8s ease forwards; }
        .text-box h1 { font-size: clamp(2rem, 4vw, 3.5rem); font-weight: 300; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 20px; color: #fff; }
        .text-box p { font-size: clamp(1rem, 1.5vw, 1.15rem); font-weight: 300; line-height: 1.6; color: rgba(255, 255, 255, 0.85); margin-bottom: 16px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="bg-container" id="bgContainer"></div>
    <div class="overlay"></div>

    <!-- Corner Menu matching your 3 pages -->
    <nav>
        <button class="nav-btn active" onclick="loadPage('page1.md', this)">One</button>
        <button class="nav-btn" onclick="loadPage('page2.md', this)">Two</button>
        <button class="nav-btn" onclick="loadPage('page3.md', this)">Three</button>
    </nav>

    <main class="content-wrapper">
        <div class="text-box" id="contentBox"><p>Loading...</p></div>
    </main>

    <script>
        // Automatically fetch images from the GitHub repo directory or use fallback list
        async function initBackgrounds() {
            let images = [];
            try {
                // If hosted on GitHub Pages, automatically read files from the 'images' folder via GitHub API
                const repoPath = window.location.pathname.split('/')[1];
                const apiUrl = window.location.hostname.includes('github.io') 
                    ? `https://api.github.com/repos/${window.location.hostname.split('.')[0]}/${repoPath}/contents/images`
                    : null;
                
                if (apiUrl) {
                    const response = await fetch(apiUrl);
                    const files = await response.json();
                    images = files.filter(file => file.name.match(/\.(jpg|jpeg|png)$/i)).map(file => file.download_url);
                }
            } catch (e) {
                console.log('Falling back to default image sequence');
            }

            // Fallback if local or API fails: Adjust names if needed, or add as many as you want
            if (images.length === 0) {
                images = ['images/photo1.jpg', 'images/photo2.jpg', 'images/photo3.jpg'];
            }

            const bgContainer = document.getElementById('bgContainer');
            images.forEach((src, idx) => {
                const slide = document.createElement('div');
                slide.className = `bg-slide ${idx === 0 ? 'active' : ''}`;
                slide.style.backgroundImage = `url('${src}')`;
                bgContainer.appendChild(slide);
            });

            if (images.length > 1) {
                let currentIndex = 0;
                setInterval(() => {
                    const slides = bgContainer.querySelectorAll('.bg-slide');
                    if(slides.length > 0) {
                        slides[currentIndex].classList.remove('active');
                        currentIndex = (currentIndex + 1) % images.length;
                        slides[currentIndex].classList.add('active');
                    }
                }, 5000); // 5 seconds per photo
            }
        }

        // Fetch and render standard Markdown (.md) text files dynamically
        async function loadPage(mdFile, btnElement) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            const contentBox = document.getElementById('contentBox');
            contentBox.style.opacity = '0';

            try {
                const response = await fetch(mdFile);
                if (!response.ok) throw new Error('File not found');
                const markdownText = await response.text();
                
                setTimeout(() => {
                    contentBox.innerHTML = marked.parse(markdownText);
                    contentBox.style.opacity = '1';
                }, 200);
            } catch (error) {
                setTimeout(() => {
                    contentBox.innerHTML = `<h1>Error</h1><p>Could not load ${mdFile}. Ensure the markdown file exists in your repository root.</p>`;
                    contentBox.style.opacity = '1';
                }, 200);
            }
        }

        window.onload = () => {
            initBackgrounds();
            loadPage('page1.md', document.querySelector('.nav-btn'));
        };
    </script>
</body>
</html>
