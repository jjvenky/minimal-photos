<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Photo Background</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for parsing Markdown files easily -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .bg-image {
            transition: opacity 1s ease-in-out;
        }
        .text-fade {
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
        }
        /* Markdown generated content styling */
        .markdown-content h1, .markdown-content h2, .markdown-content h3 {
            font-family: 'Playfair Display', serif;
            font-weight: normal;
            margin-bottom: 1rem;
        }
        .markdown-content h1 { font-size: 3rem; line-height: 1.1; }
        .markdown-content h2 { font-size: 2.25rem; }
        .markdown-content p { color: #d4d4d4; font-size: 1rem; line-height: 1.7; margin-bottom: 1.5rem; font-weight: 300; }
        .markdown-content ul { list-style-type: disc; margin-left: 1.5rem; color: #d4d4d4; }
    </style>
</head>
<body class="bg-neutral-900 text-white overflow-hidden h-screen w-screen m-0 p-0">

    <div id="background-container" class="absolute inset-0 w-full h-full z-0">
        <!-- Background images injected via JS -->
    </div>

    <!-- Dark Overlay for contrast readability -->
    <div class="absolute inset-0 bg-black/45 z-10 pointer-events-none"></div>

    <!-- Top-Right Corner Menu for switching Markdown pages -->
    <nav class="absolute top-6 right-6 z-30 flex items-center space-x-6 text-xs uppercase tracking-[0.2em]">
        <button onclick="switchPage(0, 'page1.md')" id="nav-btn-0" class="text-white font-medium hover:text-white/80 transition duration-200 focus:outline-none pb-1 border-b border-white">
            Page One
        </button>
        <button onclick="switchPage(1, 'page2.md')" id="nav-btn-1" class="text-white/60 hover:text-white transition duration-200 focus:outline-none pb-1 border-b border-transparent">
            Page Two
        </button>
        <button onclick="switchPage(2, 'page3.md')" id="nav-btn-2" class="text-white/60 hover:text-white transition duration-200 focus:outline-none pb-1 border-b border-transparent">
            Page Three
        </button>
    </nav>

    <!-- Main Content Area where Markdown renders -->
    <main class="relative z-20 flex flex-col items-center justify-center h-full text-center px-4 max-w-2xl mx-auto">
        <div id="text-content-container" class="text-fade opacity-100 transform translate-y-0 markdown-content">
            <div id="markdown-output">
                <!-- Loaded Markdown content will appear here -->
                <p class="text-neutral-400 italic">Loading content...</p>
            </div>
        </div>
        <div class="flex items-center space-x-4 mt-4">
            <button onclick="nextSlide()" class="px-6 py-2.5 rounded-full border border-white/30 bg-white/10 hover:bg-white/20 text-xs uppercase tracking-widest transition duration-300 backdrop-blur-sm cursor-pointer">
                Next Photo
            </button>
        </div>
    </main>

    <!-- Bottom Controls (Photo Navigation) -->
    <div class="absolute inset-x-0 bottom-8 z-30 flex items-center justify-between px-8 sm:px-16 pointer-events-auto">
        <!-- Previous Arrow -->
        <button onclick="prevSlide()" class="p-3 rounded-full bg-black/30 hover:bg-black/50 text-white/80 hover:text-white transition duration-200 backdrop-blur-sm focus:outline-none cursor-pointer" aria-label="Previous photo">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"></path>
            </svg>
        </button>

        <!-- Dots Indicator -->
        <div id="dots-container" class="flex space-x-2"></div>

        <!-- Next Arrow -->
        <button onclick="nextSlide()" class="p-3 rounded-full bg-black/30 hover:bg-black/50 text-white/80 hover:text-white transition duration-200 backdrop-blur-sm focus:outline-none cursor-pointer" aria-label="Next photo">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"></path>
            </svg>
        </button>
    </div>

    <script>
        // Point these to your JPG files inside your images folder (e.g., 'images/photo1.jpg')
        const images = [
            'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80',
            'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=80',
            'https://images.unsplash.com/photo-1426604966848-d7adacbd02bff?auto=format&fit=crop&w=1920&q=80',
            'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80'
        ];

        let currentIndex = 0;
        let currentPageIndex = 0;
        const totalPages = 3;
        const bgContainer = document.getElementById('background-container');
        const dotsContainer = document.getElementById('dots-container');
        const textContainer = document.getElementById('text-content-container');
        const markdownOutput = document.getElementById('markdown-output');

        function initGallery() {
            // Build image background nodes
            bgContainer.innerHTML = '';
            images.forEach((src, index) => {
                const img = document.createElement('img');
                img.src = src;
                img.onerror = function() {
                    this.src = `https://placehold.co/1920x1080/1a1a1a/ffffff?text=Image+${index+1}+Missing`;
                };
                img.className = `absolute inset-0 w-full h-full object-cover bg-image ${index === 0 ? 'opacity-100' : 'opacity-0'}`;
                img.id = `bg-img-${index}`;
                bgContainer.appendChild(img);
            });

            // Build indicator dots
            dotsContainer.innerHTML = '';
            images.forEach((_, index) => {
                const dot = document.createElement('button');
                dot.className = `w-2.5 h-2.5 rounded-full transition-all duration-300 cursor-pointer ${index === 0 ? 'bg-white w-6' : 'bg-white/40 hover:bg-white/70'}`;
                dot.onclick = () => goToSlide(index);
                dot.setAttribute('aria-label', `Go to photo ${index + 1}`);
                dotsContainer.appendChild(dot);
            });

            // Load initial page (page1.md)
            loadMarkdown('page1.md');
        }

        async function loadMarkdown(filename) {
            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error(`Could not load ${filename}`);
                const markdownText = await response.text();
                markdownOutput.innerHTML = marked.parse(markdownText);
            } catch (err) {
                markdownOutput.innerHTML = `
                    <h2 class="text-2xl font-serif mb-2">Welcome to Your Site</h2>
                    <p class="text-neutral-300">Create a file named <strong>${filename}</strong> in your repository root to customize this text easily using Markdown.</p>
                `;
            }
        }

        function updateGallery() {
            images.forEach((_, index) => {
                const img = document.getElementById(`bg-img-${index}`);
                if (index === currentIndex) {
                    img.classList.remove('opacity-0');
                    img.classList.add('opacity-100');
                } else {
                    img.classList.remove('opacity-100');
                    img.classList.add('opacity-0');
                }
            });

            const dots = dotsContainer.children;
            for (let i = 0; i < dots.length; i++) {
                if (i === currentIndex) {
                    dots[i].className = 'w-6 h-2.5 rounded-full bg-white transition-all duration-300 cursor-pointer';
                } else {
                    dots[i].className = 'w-2.5 h-2.5 rounded-full bg-white/40 hover:bg-white/70 transition-all duration-300 cursor-pointer';
                }
            }
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % images.length;
            updateGallery();
            resetTimer();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateGallery();
            resetTimer();
        }

        function goToSlide(index) {
            currentIndex = index;
            updateGallery();
            resetTimer();
        }

        function switchPage(pageIndex, filename) {
            if (currentPageIndex === pageIndex) return;
            currentPageIndex = pageIndex;

            // Update Corner Navigation Active States
            for (let i = 0; i < totalPages; i++) {
                const btn = document.getElementById(`nav-btn-${i}`);
                if (i === pageIndex) {
                    btn.className = "text-white font-medium hover:text-white/80 transition duration-200 focus:outline-none pb-1 border-b border-white";
                } else {
                    btn.className = "text-white/60 hover:text-white transition duration-200 focus:outline-none pb-1 border-b border-transparent";
                }
            }

            // Fade out, switch Markdown source, fade in
            textContainer.style.opacity = '0';
            textContainer.style.transform = 'translateY(8px)';

            setTimeout(async () => {
                await loadMarkdown(filename);
                textContainer.style.opacity = '1';
                textContainer.style.transform = 'translateY(0)';
            }, 300);
        }

        // Background rotation timer (every 8 seconds)
        let slideTimer = setInterval(nextSlide, 8000);

        function resetTimer() {
            clearInterval(slideTimer);
            slideTimer = setInterval(nextSlide, 8000);
        }

        window.onload = initGallery;
    </script>
</body>
</html>
