<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLADR</title>
    <!-- Include Marked.js to parse Markdown instantly in the browser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html { 
            width: 100%; 
            height: 100%; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            overflow: hidden; 
            background-color: #111; 
            color: #fff; 
        }
        
        /* Full-screen background slideshow */
        .bg-container { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 0; 
        }

        .bg-slide { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background-size: cover; 
            background-position: center; 
            opacity: 0; 
            transition: opacity 1.5s ease-in-out; 
        }

        .bg-slide.active { opacity: 1; }

        /* Dark overlay for contrast */
        .overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.5); 
            z-index: 1; 
        }

        /* Corner Navigation Menu */
        nav { 
            position: fixed; 
            top: 25px; 
            right: 25px; 
            z-index: 10; 
            display: flex; 
            gap: 12px; 
            background: rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(8px); 
            padding: 8px 12px; 
            border-radius: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
        }

        nav button { 
            background: transparent; 
            border: none; 
            color: rgba(255, 255, 255, 0.7); 
            font-size: 14px; 
            font-weight: 500; 
            cursor: pointer; 
            padding: 6px 12px; 
            border-radius: 20px; 
            transition: all 0.2s ease; 
        }

        nav button:hover, nav button.active { 
            color: #fff; 
            background: rgba(255, 255, 255, 0.25); 
        }

        /* Content Area - Wider & Scrollable */
        .content-wrapper { 
            position: relative; 
            z-index: 2; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            padding: 8vw; 
            overflow-y: auto; 
        }

        .text-box { 
            max-width: 800px; /* Wider text block */
            width: 100%;
            max-height: 80vh; /* Limits height so long text scrolls */
            overflow-y: auto; /* Enables smooth scrolling */
            padding-right: 15px; 
            animation: fadeIn 0.8s ease forwards; 
            background: rgba(0, 0, 0, 0.55); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 12px; 
            padding: 40px; 
        }

        /* Custom scrollbar */
        .text-box::-webkit-scrollbar { width: 6px; }
        .text-box::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 3px; }
        .text-box::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 3px; }

        /* Team Page Specific Layout Styles */
        .team-member {
            display: flex;
            gap: 24px;
            align-items: flex-start;
            margin-bottom: 35px;
        }

        .team-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.1);
        }

        .team-info h2 {
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 4px;
            color: #fff;
        }

        .team-info h3 {
            font-size: 1.1rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 12px;
        }

        .team-info p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

    <div class="bg-container" id="bgContainer"></div>
    <div class="overlay"></div>

    <!-- Update your 4 navigation buttons based on your renamed pages -->
    <nav>
        <button class="nav-btn active" onclick="loadPage('home.md', this)">Home</button>
        <button class="nav-btn" onclick="loadPage('team.md', this)">Team</button>
        <button class="nav-btn" onclick="loadPage('research.md', this)">Research</button>
        <button class="nav-btn" onclick="loadPage('opportunities.md', this)">Opportunities</button>
    </nav>

    <main class="content-wrapper">
        <div class="text-box" id="contentBox"><p>Loading...</p></div>
    </main>

    <script>
        const imageFilenames = [
            'PXL_20250815_124449417.jpg',
            'PXL_20250818_194327938.jpg',
            'PXL_20260426_132045848.jpg',
            'PXL_20260717_120230554.MP.jpg'
        ];

        function initBackgrounds() {
            const baseFolder = window.location.pathname.includes('/minimal-photos') ? '/minimal-photos/images/' : 'images/';
            const images = imageFilenames.map(file => baseFolder + file);
            const bgContainer = document.getElementById('bgContainer');

            images.forEach((src, idx) => {
                const slide = document.createElement('div');
                slide.className = `bg-slide ${idx === 0 ? 'active' : ''}`;
                slide.style.backgroundImage = `url("${src}")`;
                bgContainer.appendChild(slide);
            });

            if (images.length > 1) {
                let currentIndex = 0;
                setInterval(() => {
                    const slides = bgContainer.querySelectorAll('.bg-slide');
                    if(slides.length > 0) {
                        slides[currentIndex].classList.remove('active');
                        currentIndex = (currentIndex + 1) % images.length;
                        slides[currentIndex].classList.add('active');
                    }
                }, 5000);
            }
        }

        async function loadPage(mdFile, btnElement) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            const contentBox = document.getElementById('contentBox');
            contentBox.style.opacity = '0';

            const baseFolder = window.location.pathname.includes('/minimal-photos') ? '/minimal-photos/' : './';

            try {
                const response = await fetch(baseFolder + mdFile);
                if (!response.ok) throw new Error('File not found');
                const markdownText = await response.text();
                
                setTimeout(() => {
                    contentBox.innerHTML = marked.parse(markdownText);

                    // Automatic Team Page Formatting
                    if (mdFile === 'team.md') {
                        formatTeamPage(contentBox);
                    }

                    contentBox.style.opacity = '1';
                }, 200);
            } catch (error) {
                setTimeout(() => {
                    contentBox.innerHTML = `<h1>Error</h1><p>Could not load ${mdFile}.</p>`;
                    contentBox.style.opacity = '1';
                }, 200);
            }
        }

        // Automatically transforms H2/H3/P into side-by-side team cards with photos
        function formatTeamPage(container) {
            const children = Array.from(container.children);
            container.innerHTML = '';
            
            let currentMember = null;
            let memberIndex = 0;
            
            children.forEach(child => {
                if (child.tagName === 'H2') {
                    memberIndex++;
                    currentMember = document.createElement('div');
                    currentMember.className = 'team-member';
                    
                    // Slugify name for image filename (e.g., "Jane Doe" -> "jane-doe.jpg")
                    const nameText = child.textContent.trim();
                    const slug = nameText.toLowerCase().replace(/[^a-z0-9]/g, '-');
                    
                    const baseFolder = window.location.pathname.includes('/minimal-photos') ? '/minimal-photos/images/' : 'images/';
                    const img = document.createElement('img');
                    img.src = baseFolder + `${slug}.jpg`;
                    img.alt = nameText;
                    img.className = 'team-avatar';
                    
                    // Fallback to numbered team image if slug image isn't found
                    img.onerror = () => { img.src = baseFolder + `team-${memberIndex}.jpg`; };
                    
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'team-info';
                    infoDiv.appendChild(child);
                    
                    currentMember.appendChild(img);
                    currentMember.appendChild(infoDiv);
                    container.appendChild(currentMember);
                } else if (currentMember) {
                    currentMember.querySelector('.team-info').appendChild(child);
                } else {
                    container.appendChild(child);
                }
            });
        }

        window.onload = () => {
            initBackgrounds();
            loadPage('home.md', document.querySelector('.nav-btn'));
        };
    </script>
</body>
</html>
